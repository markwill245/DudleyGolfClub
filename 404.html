<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Dudley Golf Club</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#132419">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #132419;
            color: #F9F7F2;
            font-family: "Outfit", sans-serif;
            text-align: center;
        }

        .error-card {
            width: min(680px, 100%);
            padding: 55px 35px;
            border: 1px solid rgba(197, 163, 103, 0.45);
            background: rgba(255, 255, 255, 0.03);
        }

        .code {
            margin: 0;
            color: #C5A367;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(80px, 18vw, 150px);
            line-height: 0.8;
            font-weight: 600;
        }

        h1 {
            margin: 25px 0 12px;
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(32px, 7vw, 48px);
            font-weight: 500;
        }

        p {
            max-width: 500px;
            margin: 0 auto 30px;
            color: rgba(249, 247, 242, 0.75);
            line-height: 1.7;
        }

        a {
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid #C5A367;
            color: #C5A367;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-size: 12px;
        }

        a:hover {
            background: #C5A367;
            color: #132419;
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>
            Sorry, the page you're looking for could not be found.
            It may have been moved or is no longer available.
        </p>
        <a href="/">Return to Dudley Golf Club</a>
    </main>
</body>
</html>
