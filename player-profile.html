<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Profile | Dudley Golf Club Digital Museum</title>
  <script>
    (async function redirectMemberProfile() {
      try {
        const response = await fetch(
          "/api/member-status",
          { cache: "no-store" }
        );

        if (!response.ok) {
          return;
        }

        const status = await response.json();

        if (status.authenticated) {
          window.location.replace(
            "player-profile-members-prototype.html" +
            window.location.search
          );
        }
      } catch (error) {
        // If the status check fails, keep the public profile available.
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;600;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }

    .font-serif {
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>

<body class="bg-[#F9F7F2] text-[#132419]">

  <main class="max-w-5xl mx-auto px-6 py-16">

    <a href="player-index.html"
      class="inline-block text-sm uppercase tracking-widest text-[#C5A367] font-bold hover:text-[#132419] transition">
      ← Back to Player Index
    </a>

    <section id="profile" class="mt-10">
      <p>Loading player profile...</p>
    </section>

  </main>

  <script>
    let currentPlayer = null;
    let hallOfFameData = null;
    let oomData = null;
    let ledgerData = null;
    let metricData = null;

    function getSlug() {
      const params = new URLSearchParams(window.location.search);
      return params.get("player");
    }

    function normalise(value) {
      return String(value || "").trim().toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getHallOfFamePlayer(player) {
      const section =
        normalise(player.hero?.section) === "seniors"
          ? "seniors"
          : "mens";

      return (
        hallOfFameData?.[section]?.leaderboard || []
      ).find(row =>
        normalise(row.name) === normalise(player.hero?.name)
      ) || null;
    }

    function getOomPlayer(player) {
      const section =
        normalise(player.hero?.section) === "seniors"
          ? "seniors"
          : "mens";

      const sectionData = oomData?.[section];

      if (!sectionData) {
        return {
          season: null,
          row: null
        };
      }

      const season = sectionData.currentSeason;
      const seasonData = sectionData.seasons?.[season];

      const rows =
        seasonData?.leaderboard ||
        seasonData?.players ||
        seasonData?.standings ||
        [];

      return {
        season,
        row:
          rows.find(row =>
            normalise(row.player) ===
            normalise(player.hero?.name)
          ) || null
      };
    }

    function getCertifiedScoringAverages(player) {
      const metric =
        metricData?.metrics?.find(
          item =>
            item.metricId ===
            "career-scoring-averages"
        );

      const name =
        normalise(player.hero?.name);

      function findPlayer(rows) {
        return (
          rows?.find(row =>
            normalise(row.playerName) === name
          ) || null
        );
      }

      return {
        mens: {
          gross:
            findPlayer(
              metric?.sectionLeaderboards
                ?.mens
                ?.eighteenHole
                ?.grossDerived
            ),

          medal:
            findPlayer(
              metric?.sectionLeaderboards
                ?.mens
                ?.eighteenHole
                ?.nett
            ),

          stableford:
            findPlayer(
              metric?.sectionLeaderboards
                ?.mens
                ?.eighteenHole
                ?.stableford
            )
        },

        seniors: {
          nineHole: {
            medal:
              findPlayer(
                metric?.sectionLeaderboards
                  ?.seniors
                  ?.nineHole
                  ?.nett
              ),

            stableford:
              findPlayer(
                metric?.sectionLeaderboards
                  ?.seniors
                  ?.nineHole
                  ?.stableford
              )
          },

          eighteenHole: {
            gross:
              findPlayer(
                metric?.sectionLeaderboards
                  ?.seniors
                  ?.eighteenHole
                  ?.grossDerived
              ),

            medal:
              findPlayer(
                metric?.sectionLeaderboards
                  ?.seniors
                  ?.eighteenHole
                  ?.nett
              ),

            stableford:
              findPlayer(
                metric?.sectionLeaderboards
                  ?.seniors
                  ?.eighteenHole
                  ?.stableford
              )
          }
        }
      };
    }
    function formatScoringDate(value) {
      if (!value) return "";

      const date = new Date(`${value}T00:00:00`);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function getScoringEvidenceItem(key) {
      if (!currentPlayer) return null;

      const scoring =
        getCertifiedScoringAverages(currentPlayer);

      const lookup = {
        "mens-gross":
          scoring.mens.gross,

        "mens-medal":
          scoring.mens.medal,

        "mens-stableford":
          scoring.mens.stableford,

        "seniors-9-medal":
          scoring.seniors.nineHole.medal,

        "seniors-9-stableford":
          scoring.seniors.nineHole.stableford,

        "seniors-18-gross":
          scoring.seniors.eighteenHole.gross,

        "seniors-18-medal":
          scoring.seniors.eighteenHole.medal,

        "seniors-18-stableford":
          scoring.seniors.eighteenHole.stableford
      };

      return lookup[key] || null;
    }

    function toggleScoringEvidence(button, key, title, scoreLabel) {
      const panel =
        document.getElementById("scoring-evidence-panel");

      if (!panel) return;

      const wasOpen =
        panel.dataset.scoringKey === key &&
        !panel.classList.contains("hidden");

      document
        .querySelectorAll("[data-scoring-card]")
        .forEach(card => {
          card.style.borderColor = "";
          card.style.backgroundColor = "";
          card.style.boxShadow = "";
          card.setAttribute("aria-expanded", "false");
        });

      if (wasOpen) {
        panel.classList.add("hidden");
        panel.dataset.scoringKey = "";
        panel.innerHTML = "";
        return;
      }

      const item =
        getScoringEvidenceItem(key);

      const rounds =
        Array.isArray(item?.qualifyingRounds)
          ? [...item.qualifyingRounds]
          : [];

      rounds.sort((a, b) =>
        String(b.date || "").localeCompare(
          String(a.date || "")
        )
      );

      button.style.borderColor = "#C5A367";
      button.style.backgroundColor = "#F9F7F2";
      button.style.boxShadow =
        "0 0 0 2px rgba(197,163,103,0.30)";

      button.setAttribute(
        "aria-expanded",
        "true"
      );

      panel.dataset.scoringKey = key;

      panel.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
          <div>
            <p class="uppercase tracking-[0.2em] text-xs text-[#C5A367] font-bold mb-1">
              Certified Round Evidence
            </p>

            <h3 class="text-xl font-serif text-[#132419]">
              ${escapeHtml(title)}
            </h3>

            <p class="text-sm text-gray-600 mt-1">
              ${escapeHtml(rounds.length)} qualifying rounds used in this career average
            </p>
          </div>

          <button
            type="button"
            class="text-sm font-semibold text-[#132419] underline"
            onclick="closeScoringEvidence()">
            Close
          </button>
        </div>

        ${rounds.length
          ? `
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead>
                    <tr class="border-b border-[#C5A367]/30 text-left">
                      <th class="py-2 pr-4">Date</th>
                      <th class="py-2 pr-4">Competition</th>
                      <th class="py-2 text-right">${escapeHtml(scoreLabel)}</th>
                    </tr>
                  </thead>

                  <tbody>
                    ${rounds.map(round => `
                      <tr class="border-b border-gray-100">
                        <td class="py-3 pr-4 whitespace-nowrap">
                          ${escapeHtml(formatScoringDate(round.date))}
                        </td>

                        <td class="py-3 pr-4">
                          ${escapeHtml(round.competitionName || round.competitionId || "")}
                        </td>

                      <td class="py-3 text-right font-semibold">
  ${escapeHtml(
            key.includes("gross")
              ? round.grossScore
              : round.score
          )}
</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            `
          : `
              <p class="text-gray-600">
                Certified round evidence is not available for this record.
              </p>
            `
        }
      `;

      panel.classList.remove("hidden");
    }

    function closeScoringEvidence() {
      const panel =
        document.getElementById("scoring-evidence-panel");

      if (!panel) return;

      panel.classList.add("hidden");
      panel.dataset.scoringKey = "";
      panel.innerHTML = "";

      document
        .querySelectorAll("[data-scoring-card]")
        .forEach(card => {
          card.style.borderColor = "";
          card.style.backgroundColor = "";
          card.style.boxShadow = "";
          card.setAttribute("aria-expanded", "false");
        });
    }
    async function loadLedger() {
      if (ledgerData) {
        return ledgerData;
      }

      const response = await fetch(
        "data/certified-event-ledger.json",
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          `Certified ledger returned ${response.status}`
        );
      }

      ledgerData = await response.json();
      return ledgerData;
    }

    function getCertifiedResults(player) {
      if (!ledgerData) {
        return [];
      }

      const name = player.hero?.name || "";
      const section = player.hero?.section || "Mens";

      return (ledgerData.records || [])
        .filter(row =>
          row.evidenceType === "competitive-result" &&
          row.appearanceEligible === true &&
          normalise(row.playerName) === normalise(name) &&
          normalise(row.section) === normalise(section)
        )
        .sort((a, b) =>
          String(b.date || b.year || "")
            .localeCompare(
              String(a.date || a.year || "")
            )
        );
    }

    async function renderPlayed(player) {
      await loadLedger();

      const rows = getCertifiedResults(player);

      return `
      <h3 class="text-2xl font-serif mb-1">
        Certified Appearances
      </h3>

      <p class="text-sm text-gray-500 mb-5">
        ${rows.length} qualifying competition
        ${rows.length === 1 ? "appearance" : "appearances"}
      </p>

      <div class="max-h-[520px] overflow-y-auto space-y-2 pr-2">
        ${rows.map(row => `
          <div class="rounded-xl bg-[#F9F7F2] px-4 py-3">
            <div class="flex justify-between gap-4">
              <strong>
                ${row.competitionId
                  ? `<a href="competition-profile.html?id=${encodeURIComponent(row.competitionId)}"
                       class="hover:text-[#C5A367] underline-offset-4 hover:underline">
                       ${escapeHtml(row.competitionName || row.competitionId)}
                     </a>`
                  : escapeHtml(row.competitionName || "")}
              </strong>

              <span class="text-sm text-[#C5A367] font-bold">
                ${escapeHtml(row.date || row.year || "")}
              </span>
            </div>

            ${row.position
          ? `
                  <p class="text-sm text-gray-600 mt-1">
                    Position ${escapeHtml(row.position)}
                  </p>
                `
          : ""
        }
          </div>
        `).join("")}
      </div>
    `;
    }

    function renderWins(player) {
      const hof = getHallOfFamePlayer(player);
      const wins = hof?.winEvidence || [];

      if (!wins.length) {
        return `
        <h3 class="text-2xl font-serif mb-2">
          Certified Wins
        </h3>

        <p class="text-gray-600">
          No certified career wins recorded.
        </p>
      `;
      }

      return `
      <h3 class="text-2xl font-serif mb-1">
        Certified Wins
      </h3>

      <p class="text-sm text-gray-500 mb-5">
        ${wins.length} certified career
        ${wins.length === 1 ? "win" : "wins"}
      </p>

      <div class="space-y-3">
        ${wins
          .slice()
          .sort((a, b) =>
            Number(b.year || 0) -
            Number(a.year || 0)
          )
          .map(win => `
            <div class="rounded-xl bg-[#F9F7F2] px-4 py-3">

              <div class="flex justify-between gap-4">
              <strong>
  ${win.competitionId
              ? `<a href="competition-profile.html?id=${encodeURIComponent(win.competitionId)}"
         class="hover:text-[#C5A367] underline-offset-4 hover:underline">
         ${escapeHtml(win.competitionName || win.competitionId)}
       </a>`
              : escapeHtml(win.competitionName || "")}
</strong>

                <span class="text-[#C5A367] font-bold">
                  ${escapeHtml(win.year)}
                </span>
              </div>

              <div class="flex flex-wrap gap-3 mt-2 text-sm text-gray-600">
                ${win.majorWin ? "<span>Major</span>" : ""}
                ${win.medalWin ? "<span>Medal</span>" : ""}
                ${win.matchplayWin ? "<span>Matchplay</span>" : ""}
              </div>

            </div>
          `)
          .join("")}
      </div>
    `;
    }

    async function renderRunnerUp(player) {
      await loadLedger();

      const rows = getCertifiedResults(player)
        .filter(row => row.runnerUp === true);

      if (!rows.length) {
        return `
        <h3 class="text-2xl font-serif mb-2">
          Certified Runner-up Finishes
        </h3>

        <p class="text-gray-600">
          No certified runner-up finishes recorded.
        </p>
      `;
      }

      return `
      <h3 class="text-2xl font-serif mb-1">
        Certified Runner-up Finishes
      </h3>

      <p class="text-sm text-gray-500 mb-5">
        ${rows.length} qualifying
        ${rows.length === 1 ? "finish" : "finishes"}
      </p>

      <div class="space-y-2">
        ${rows.map(row => `
          <div class="rounded-xl bg-[#F9F7F2] px-4 py-3">
            <div class="flex justify-between gap-4">
            <strong>
  ${row.competitionId
          ? `<a href="competition-profile.html?id=${encodeURIComponent(row.competitionId)}"
         class="hover:text-[#C5A367] underline-offset-4 hover:underline">
         ${escapeHtml(row.competitionName || row.competitionId)}
       </a>`
          : escapeHtml(row.competitionName || "")}
</strong>

              <span class="text-[#C5A367] font-bold">
                #2
              </span>
            </div>

            <p class="text-sm text-gray-500 mt-1">
              ${escapeHtml(row.date || row.year || "")}
            </p>
          </div>
        `).join("")}
      </div>
    `;
    }

    async function renderTop3(player) {
      await loadLedger();

      const rows = getCertifiedResults(player)
        .filter(row => row.top3 === true);

      if (!rows.length) {
        return `
        <h3 class="text-2xl font-serif mb-2">
          Certified Top 3 Finishes
        </h3>

        <p class="text-gray-600">
          No certified Top 3 finishes recorded.
        </p>
      `;
      }

      return `
      <h3 class="text-2xl font-serif mb-1">
        Certified Top 3 Finishes
      </h3>

      <p class="text-sm text-gray-500 mb-5">
        ${rows.length} qualifying
        ${rows.length === 1 ? "finish" : "finishes"}
      </p>

      <div class="max-h-[520px] overflow-y-auto space-y-2 pr-2">

        ${rows.map(row => `
          <div class="rounded-xl bg-[#F9F7F2] px-4 py-3">

            <div class="flex justify-between gap-4">
              <strong>
                ${row.competitionId
                  ? `<a href="competition-profile.html?id=${encodeURIComponent(row.competitionId)}"
                       class="hover:text-[#C5A367] underline-offset-4 hover:underline">
                       ${escapeHtml(row.competitionName || row.competitionId)}
                     </a>`
                  : escapeHtml(row.competitionName || "")}
              </strong>

              <span class="text-[#C5A367] font-bold">
                #${escapeHtml(row.position)}
              </span>
            </div>

            <p class="text-sm text-gray-500 mt-1">
              ${escapeHtml(row.date || row.year || "")}
            </p>

          </div>
        `).join("")}

      </div>
    `;
    }

    function renderHallOfFame(player) {
      const hof = getHallOfFamePlayer(player);

      if (!hof) {
        return `
        <p class="text-gray-600">
          No certified Hall of Fame record.
        </p>
      `;
      }

      const scoring =
        hallOfFameData?.scoring || {};

      const premiumPoints =
        scoring.premiumHonour ??
        hallOfFameData?.premiumHonours?.bonus ??
        25;

      const rows = [
        ["Career Wins", hof.wins, scoring.win || 0],
        ["Major Wins", hof.majorWins, scoring.majorWin || 0],
        ["Premium Honours", hof.premiumHonours, premiumPoints],
        ["Medal Wins", hof.medalWins, scoring.medalWin || 0],
        ["Matchplay Wins", hof.matchplayWins, scoring.matchplayWin || 0],
        ["Runner-up", hof.runnerUp, scoring.runnerUp || 0],
        ["Top 3", hof.top3, scoring.top3 || 0],
        ["Top 5", hof.top5, scoring.top5 || 0],
        [
          "Section Records",
          hof.recordsHeld?.length || 0,
          scoring.sectionRecord || 0
        ]
      ];

      return `
      <div class="flex items-end justify-between gap-5 mb-5">

        <div>
          <h3 class="text-2xl font-serif">
            Hall of Fame Breakdown
          </h3>

          <p class="text-sm text-gray-500">
            Certified scoring calculation
          </p>
        </div>

        <strong class="text-4xl font-serif text-[#C5A367]">
          ${hof.score}
        </strong>

      </div>

      <div class="space-y-2">
        ${rows
          .filter(row => Number(row[1] || 0) > 0)
          .map(([label, count, rate]) => `
            <div class="flex justify-between gap-4 rounded-xl bg-[#F9F7F2] px-4 py-3">

              <span>${escapeHtml(label)}</span>

              <strong>
                ${count} × ${rate}
                =
                ${Number(count) * Number(rate)}
              </strong>

            </div>
          `)
          .join("")}
      </div>

      <div class="mt-5 pt-4 border-t border-[#C5A367]/30 flex justify-between text-lg font-bold">

        <span>Total HOF Score</span>

        <span>${hof.score}</span>

      </div>
    `;
    }

    function renderOom(player) {
      const oom = getOomPlayer(player);

      if (!oom.row) {
        return `
        <h3 class="text-2xl font-serif mb-2">
          Order of Merit
        </h3>

        <p class="text-gray-600">
          No OOM points recorded for the current season.
        </p>
      `;
      }

      const row = oom.row;

      return `
      <div class="flex justify-between gap-5 mb-5">

        <div>
          <h3 class="text-2xl font-serif">
            Order of Merit
          </h3>

          <p class="text-sm text-gray-500">
            ${escapeHtml(oom.season)} season
          </p>
        </div>

        <div class="text-right">
          <strong class="text-3xl font-serif">
            #${row.rank}
          </strong>

          <p class="text-sm text-gray-500">
            ${row.points} points
          </p>
        </div>

      </div>

      <div class="space-y-2">
        ${(row.results || [])
          .slice()
          .sort((a, b) =>
            String(b.date || "")
              .localeCompare(
                String(a.date || "")
              )
          )
          .map(result => `
            <div class="rounded-xl bg-[#F9F7F2] px-4 py-3">

              <div class="flex justify-between gap-4">

                <strong>
                  ${escapeHtml(result.competition)}
                </strong>

                <span class="text-[#C5A367] font-bold">
                  +${result.points}
                </span>

              </div>

              <p class="text-sm text-gray-500 mt-1">
                ${escapeHtml(result.date || result.year)}
                • Position ${escapeHtml(result.position)}
              </p>

            </div>
          `)
          .join("")}
      </div>

      <div class="mt-5 pt-4 border-t border-[#C5A367]/30 flex justify-between font-bold">

        <span>Total</span>

        <span>${row.points} points</span>

      </div>
    `;
    }

    async function loadPlayerProfile() {
      const slug = getSlug();
      const container = document.getElementById("profile");

      if (!slug) {
        const robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex,follow";
        document.head.appendChild(robots);

        container.innerHTML = "<p>No player selected.</p>";
        return;
      }

      const [
        playerResponse,
        hofResponse,
        oomResponse,
        metricResponse
      ] = await Promise.all([
        fetch("data/player-page-data.json", {
          cache: "no-store"
        }),
        fetch("data/hall-of-fame-certified.json", {
          cache: "no-store"
        }),
        fetch("data/order-of-merit-certified.json", {
          cache: "no-store"
        }),
        fetch("data/metric-certification.json", {
          cache: "no-store"
        })
      ]);

      if (
        !playerResponse.ok ||
        !hofResponse.ok ||
        !oomResponse.ok ||
        !metricResponse.ok
      ) {
        throw new Error(
          "Certified player data could not be loaded."
        );
      }

      const players = await playerResponse.json();
      hallOfFameData = await hofResponse.json();
      oomData = await oomResponse.json();
      metricData = await metricResponse.json();

      const player =
        players.find(p => p.slug === slug);

      if (!player) {
        const robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex,follow";
        document.head.appendChild(robots);

        container.innerHTML =
          "<p>Player profile not found.</p>";
        return;
      }

      const canonical = document.createElement("link");
      canonical.rel = "canonical";
      canonical.href =
        "https://dudleygolfclub.co.uk/player-profile?player=" +
        encodeURIComponent(player.slug);
      document.head.appendChild(canonical);

      currentPlayer = player;

      const gotyResponse =
        await fetch("data/golfer-of-the-year-lifetime.json", {
          cache: "no-store"
        });

      let gotyHonours = [];

      if (gotyResponse.ok) {
        const gotyLifetime =
          await gotyResponse.json();

        const gotyRows =
          Array.isArray(gotyLifetime)
            ? gotyLifetime
            : Object.values(gotyLifetime || {});

        const gotyRow =
          gotyRows.find(row =>
            normalise(row.player) ===
            normalise(player.player) &&
            normalise(row.section) ===
            normalise(player.section)
          ) || null;

        gotyHonours =
          (gotyRow?.results || [])
            .filter(result =>
              result.competitionId ===
              "golfer-of-the-year"
            )
            .sort((a, b) =>
              Number(a.year || 0) -
              Number(b.year || 0)
            );
      }

      const hof = getHallOfFamePlayer(player);
      const oom = getOomPlayer(player);

      const hofScore =
        hof?.score ??

    Discover detailed gross, nett and Stableford scoring averages,
    medal performances, individual round records and complete
    competition histories in the Dudley Golf Club Members View.
  </p>

  <a
    href="login.html?return=${encodeURIComponent('/player-profile.html' + window.location.search)}"
    class="inline-flex items-center justify-center rounded-xl bg-[#132419] px-6 py-3 text-sm font-semibold text-white hover:bg-[#254331] transition-colors"
  >

  </a>
</section>
        <div
          id="profile-stat-panel"

              <h2 class="text-3xl font-serif">

              </h2>

              <strong class="text-[#132419] text-xl">
                ${player.divisionHonours?.totalWins || 0}
              </strong>
              <br>
              Total Division Wins
            </div>
          </div>

          <div class="grid md:grid-cols-3 gap-4 mb-5">
                            ${[1, 2, 3].map(division => {
          const key = `division${division}`;

          return `
                <div class="rounded-xl border border-[#C5A367]/30 bg-[#F9F7F2] p-5">

                  <h3 class="font-serif text-xl mb-3">
                    Division ${division}
                  </h3>

                  <div class="flex justify-between py-2 border-b border-[#132419]/10">
                    <span>Wins</span>

                    <strong>
                      ${player.divisionHonours?.wins?.[key] || 0}
                    </strong>
                  </div>

                  <div class="flex justify-between py-2">
                    <span>Top 3 Finishes</span>

                    <strong>
                      ${player.divisionHonours?.top3?.[key] || 0}

                </div>
              `;
        }).join("")}
          </div>

          <div class="rounded-xl border border-[#C5A367]/30 bg-[#F9F7F2] p-5">
  <p class="font-semibold text-[#132419] mb-2">
    Explore Medal Division History
  </p>

  <p class="text-sm text-gray-700 leading-relaxed mb-4">
    Dudley Golf Club members can explore the complete medal
    history, including individual competitions, finishing
    positions and recorded scores.
  </p>

  <a
    href="login.html?return=${encodeURIComponent('/player-profile.html' + window.location.search)}"

  >
    View Full Medal History
    <span aria-hidden="true" class="ml-2">&rarr;</span>
  </a>
</div>
        </section>

        ${gotyHonours.length ? `
        <section class="mb-10">
          <div class="rounded-2xl border-2 border-[#C5A367]/50 bg-[#132419] text-white p-8 shadow-lg">

            <p class="uppercase tracking-[0.3em] text-xs text-[#C5A367] font-bold mb-3">
              Honour Roll
            </p>

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">

              <div>
                <h2 class="text-3xl md:text-4xl font-serif mb-2">
                  Golfer of the Year
                </h2>

                <p class="text-white/70">
                  Separate certified honour
                </p>
              </div>

              <div class="text-left md:text-right">
                <strong class="text-4xl font-serif text-[#C5A367]">
                  ${gotyHonours.length}
                </strong>

                <p class="text-sm uppercase tracking-[0.2em] text-white/70">
                  ${gotyHonours.length === 1
            ? "1-Time Winner"
            : gotyHonours.length + "-Time Winner"}
                </p>
              </div>

            </div>

            <div class="mt-6 pt-5 border-t border-white/20">
              <p class="text-xs uppercase tracking-[0.2em] text-[#C5A367] font-bold mb-3">
                Winning Years
              </p>

              <div class="flex flex-wrap gap-3">
                ${gotyHonours.map(result => `
                  <span class="rounded-full border border-[#C5A367]/50 px-4 py-2 text-sm font-semibold">
                    ${escapeHtml(result.year)}
                  </span>
                `).join("")}
              </div>
            </div>

            <p class="mt-5 text-xs text-white/50">
              This honour is recorded separately and is not included in Career Wins.
            </p>

          </div>
        </section>
        ` : ""}

        <h2 class="text-2xl font-serif mb-4">
          Career Timeline
        </h2>

        <div class="space-y-3">

          ${(player.timeline || []).map((item, index) => ({ item, index })).sort((a, b) => Number(b.item.year || 0) - Number(a.item.year || 0) || a.index - b.index).slice(0, 5).map(({ item }) => {
              const scoreText =
                item.score !== null &&
                  item.score !== undefined
                  ? `${item.scoreType ? escapeHtml(item.scoreType) + " " : ""}${escapeHtml(item.score)}`
                  : "";

              const parText =
                item.relativeToPar !== null &&
                  item.relativeToPar !== undefined
                  ? (
                    Number(item.relativeToPar) === 0
                      ? "E"
                      : Number(item.relativeToPar) > 0
                        ? `+${item.relativeToPar}`
                        : String(item.relativeToPar)
                  )
                  : "";

              return `
              <div class="border-l-4 border-[#C5A367] pl-4 py-2">

                <strong>
                  ${escapeHtml(item.year)}
                </strong>

                &mdash;
                ${escapeHtml(item.competition)}

                <div class="text-sm text-gray-600 mt-1">
                  Position ${escapeHtml(item.position)}
                  ${scoreText ? ` &bull; ${scoreText}` : ""}
                  ${parText ? ` &bull; ${escapeHtml(parText)}` : ""}
                </div>

              </div>
            `;
            }).join("")}

        </div>

      </div>
    `;

      const panel =
        document.getElementById(
          "profile-stat-panel"
        );

      document
        .querySelectorAll(
          ".profile-stat"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              const stat =
                button.dataset.profileStat;

              const alreadyOpen =
                !panel.classList.contains(
                  "hidden"
                ) &&
                panel.dataset.openStat ===
                stat;

              document
                .querySelectorAll(
                  ".profile-stat"
                )
                .forEach(item =>
                  item.classList.remove(
                    "bg-[#C5A367]",
                    "text-[#132419]",
                    "shadow-md",
                    "ring-2",
                    "ring-[#C5A367]/40"
                  )
                );

              if (alreadyOpen) {
                panel.classList.add("hidden");
                panel.innerHTML = "";
                panel.dataset.openStat = "";
                return;
              }

              button.classList.add(
                "bg-[#C5A367]",
                "text-[#132419]",
                "shadow-md",
                "ring-2",
                "ring-[#C5A367]/40"
              );

              panel.classList.remove("hidden");
              panel.dataset.openStat = stat;

              if (stat === "wins") {
                panel.innerHTML =
                  renderWins(player);
                return;
              }

              if (stat === "hof") {
                panel.innerHTML =
                  renderHallOfFame(player);
                return;
              }

              if (stat === "oom") {
                panel.innerHTML =
                  renderOom(player);
                return;
              }

              panel.innerHTML = `
              <p class="text-gray-500">
                Loading certified evidence...
              </p>
            `;

              try {
                if (stat === "played") {
                  panel.innerHTML =
                    await renderPlayed(player);
                }

                if (stat === "runnerup") {
                  panel.innerHTML =
                    await renderRunnerUp(player);
                }

                if (stat === "top3") {
                  panel.innerHTML =
                    await renderTop3(player);
                }
              } catch (error) {
                console.error(error);

                panel.innerHTML = `
                <p class="text-red-700">
                  Unable to load certified evidence.
                </p>
              `;
              }
            }
          );
        });
    }

    loadPlayerProfile().catch(error => {
      console.error(error);

      document.getElementById(
        "profile"
      ).innerHTML = `
      <p>
        Certified player profile could not be loaded.
      </p>
    `;
    });
  </script>


  <button id="backToTop"
    type="button"
    aria-label="Back to top"
    class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 hidden items-center justify-center bg-[#132419] text-[#C5A367] border-2 border-[#C5A367] px-3 py-2.5 sm:px-4 sm:py-3 rounded-xl shadow-lg hover:bg-[#C5A367] hover:text-[#132419] transition-all duration-300 z-50 text-xs sm:text-sm font-bold">
    <span class="sm:hidden">&#8593; Top</span>
    <span class="hidden sm:inline">Back to Top &#8593;</span>
  </button>

  <script>
    const backToTop = document.getElementById("backToTop");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 300) {
        backToTop.classList.remove("hidden");
      } else {
        backToTop.classList.add("hidden");
      }
    });

    backToTop.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
