<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Order of Merit | Dudley Golf Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: Outfit, sans-serif;
      background: #F9F7F2;
      color: #132419
    }

    .serif {
      font-family: "Cormorant Garamond", serif
    }
  </style>
</head>

<body>

  <header class="bg-[#132419] text-white px-6 py-5">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="digital-museum.html"
        class="inline-block text-sm uppercase tracking-widest text-[#C5A367] font-bold hover:text-white transition">
        ← Back to Museum
      </a>

    </div>
  </header>

  <section class="bg-[#132419] text-white px-6 py-20">
    <div class="max-w-7xl mx-auto">
      <p class="text-xs uppercase tracking-[0.4em] text-[#C5A367] mb-6">Digital Museum</p>
      <h1 class="serif text-6xl md:text-8xl leading-none mb-6">Order of Merit</h1>
      <p class="max-w-3xl text-white/70 text-lg">
        Separate Men's and Seniors leaderboards generated from verified Museum competition results and their approved
        scoring systems.
      </p>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-6 py-16">
    <div class="flex flex-wrap gap-3 mb-10">
      <button type="button"
        class="oom-button bg-[#132419] text-white px-6 py-3 uppercase tracking-[0.2em] text-xs font-bold rounded"
        data-section="mens">
        Men's Order of Merit
      </button>

      <button type="button"
        class="oom-button bg-white text-[#132419] border border-[#132419]/20 px-6 py-3 uppercase tracking-[0.2em] text-xs font-bold rounded"
        data-section="seniors">
        Seniors Order of Merit
      </button>
    </div>

    <div id="oom">Loading Order of Merit...</div>
  </main>

  <script>
    const state = {
      activeSection: "mens",
      selectedSeason: {
        mens: "",
        seniors: ""
      },
      mens: null,
      seniors: null
    };

    function num(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : 0;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function medal(rank) {
      if (rank === 1) return "🥇";
      if (rank === 2) return "🥈";
      if (rank === 3) return "🥉";
      return rank;
    }

    function makeSlug(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function normalisePlayer(player, index) {
      const name =
        player.player ||
        player.playerName ||
        player.name ||
        "Unknown Player";

      return {
        rank: num(player.rank) || index + 1,
        player: name,
        slug:
          player.slug ||
          player.playerSlug ||
          makeSlug(name),
        points:
          num(player.points) ||
          num(player.orderOfMeritPoints),
        wins: num(player.wins),
        top10:
          num(player.top10) ||
          num(player.topTen),
        results: Array.isArray(player.results)
          ? player.results
          : []
      };
    }

    function ordinal(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      const remainder100 = number % 100;

      if (
        remainder100 >= 11 &&
        remainder100 <= 13
      ) {
        return `${number}th`;
      }

      const remainder10 = number % 10;

      if (remainder10 === 1) return `${number}st`;
      if (remainder10 === 2) return `${number}nd`;
      if (remainder10 === 3) return `${number}rd`;

      return `${number}th`;
    }

    function competitionSlug(result) {
      return (
        result?.competitionId ||
        makeSlug(result?.competition)
      );
    }

    function pointsBreakdown(player) {
      const results = player.results || [];

      return `
        <tr
          id="breakdown-${escapeHtml(player.slug)}"
          class="oom-breakdown hidden bg-[#F9F7F2]"
        >
          <td colspan="5" class="p-0">
            <div class="p-6 md:p-8 border-t border-[#C5A367]/30">
              <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3 mb-6">
                <div>
                  <p class="text-xs uppercase tracking-[0.3em] text-[#C5A367] mb-2">
                    Certified Points Breakdown
                  </p>

                  <h3 class="serif text-3xl">
                    ${escapeHtml(player.player)}
                  </h3>
                </div>

                <p class="font-bold text-lg">
                  Certified total:
                  ${player.points}
                  ${player.points === 1 ? "point" : "points"}
                </p>
              </div>

              ${results.length
          ? `
                    <div class="space-y-3">
                      ${results.map(result => {
            const slug =
              competitionSlug(result);

            return `
                          <div class="grid md:grid-cols-[1fr_auto_auto] gap-3 items-center bg-white border border-[#C5A367]/20 rounded p-4">
                            <div>
                              <a
                                href="competition-profile.html?competition=${encodeURIComponent(slug)}"
                                class="font-semibold hover:text-[#C5A367] transition"
                              >
                                ${escapeHtml(
              result.competition ||
              result.competitionName ||
              result.competitionId ||
              "Unknown Competition"
            )}
                              </a>

                              ${result.year ? `
                                <span class="block text-xs text-gray-500 mt-1">
                                  ${escapeHtml(result.year)}
                                </span>
                              ` : ""}
                            </div>

                            <div class="text-sm text-gray-600">
                              ${result.label
                                ? `
                                  <strong class="text-[#132419]">
                                    ${escapeHtml(result.label)}
                                  </strong>
                                `
                                : `
                                  Position:
                                  <strong class="text-[#132419]">
                                    ${ordinal(result.position)}
                                  </strong>
                                `
                              }
                            </div>

                            <div class="font-bold text-right">
                              ${num(result.points)}
                              ${num(result.points) === 1 ? "pt" : "pts"}
                            </div>
                          </div>
                        `;
          }).join("")}
                    </div>
                  `
          : `
                    <p class="text-gray-500">
                      No certified point transactions are recorded for this player.
                    </p>
                  `
        }

              <div class="flex justify-between items-center border-t border-[#C5A367]/30 mt-6 pt-5">
                <strong>Certified Order of Merit total</strong>
                <strong class="text-xl">
                  ${player.points}
                  ${player.points === 1 ? "point" : "points"}
                </strong>
              </div>
            </div>
          </td>
        </tr>
      `;
    }

    function toggleBreakdown(slug, button) {
      const row = document.getElementById(
        `breakdown-${slug}`
      );

      if (!row) {
        return;
      }

      const opening =
        row.classList.contains("hidden");

      document
        .querySelectorAll(".oom-breakdown")
        .forEach(item => {
          item.classList.add("hidden");
        });

      document
        .querySelectorAll(".oom-player-button")
        .forEach(item => {
          item.setAttribute(
            "aria-expanded",
            "false"
          );
        });

      if (opening) {
        row.classList.remove("hidden");

        button.setAttribute(
          "aria-expanded",
          "true"
        );
      }
    }

    function updateButtons() {
      document.querySelectorAll(".oom-button").forEach(button => {
        const active =
          button.dataset.section === state.activeSection;

        button.classList.toggle("bg-[#132419]", active);
        button.classList.toggle("text-white", active);
        button.classList.toggle("bg-white", !active);
        button.classList.toggle("text-[#132419]", !active);
        button.classList.toggle("border", !active);
        button.classList.toggle(
          "border-[#132419]/20",
          !active
        );
      });
    }

    function changeSeason(season) {
      state.selectedSeason[
        state.activeSection
      ] = season;

      render(state.activeSection);
    }

    function seasonSelector(sectionData, selectedSeason) {
      const seasons =
        Array.isArray(sectionData?.seasonOrder)
          ? sectionData.seasonOrder
          : [];

      if (seasons.length <= 1) {
        return "";
      }

      return `
        <section class="bg-white border border-[#C5A367]/30 rounded shadow p-6 mb-10">
          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <p class="text-xs uppercase tracking-[0.25em] text-[#C5A367] mb-2">
                Historical Seasons
              </p>

              <h2 class="serif text-3xl">
                Select a Season
              </h2>
            </div>

            <select
              id="seasonSelector"
              class="min-w-52 border border-[#C5A367]/40 bg-[#F9F7F2] rounded px-5 py-3 font-semibold"
              onchange="changeSeason(this.value)"
            >
              ${seasons.map(season => `
                <option
                  value="${escapeHtml(season)}"
                  ${season === selectedSeason ? "selected" : ""}
                >
                  ${escapeHtml(season)}
                  ${season === sectionData.currentSeason ? " — Current" : ""}
                </option>
              `).join("")}
            </select>
          </div>
        </section>
      `;
    }

    function render(section) {
      state.activeSection = section;

      const sectionData =
        state[section] || {
          currentSeason: "",
          seasonOrder: [],
          seasons: {}
        };

      const selectedSeason =
        state.selectedSeason[section] ||
        sectionData.currentSeason ||
        sectionData.seasonOrder?.[0] ||
        "";

      state.selectedSeason[section] =
        selectedSeason;

      const season =
        sectionData.seasons?.[
        selectedSeason
        ] || {
          season: selectedSeason,
          leaderboard: []
        };

      /*
       * Display the certified season and leaderboard exactly
       * as supplied. Do not sort, re-rank or recalculate here.
       */
      const players =
        (season.leaderboard || [])
          .map(normalisePlayer);

      const leader =
        players[0] || null;

      const sectionName =
        section === "seniors"
          ? "Seniors"
          : "Men's";

      document.getElementById("oom").innerHTML = `
        ${seasonSelector(
        sectionData,
        selectedSeason
      )}

        <section class="grid md:grid-cols-4 gap-6 mb-14">
          <div class="bg-white border border-[#C5A367]/30 p-6 rounded shadow">
            <p class="text-xs uppercase tracking-[0.25em] text-[#C5A367] mb-2">
              Selected Season
            </p>
            <p class="serif text-3xl">
              ${escapeHtml(season.season || selectedSeason || "—")}
            </p>
          </div>

          <div class="bg-white border border-[#C5A367]/30 p-6 rounded shadow">
            <p class="text-xs uppercase tracking-[0.25em] text-[#C5A367] mb-2">
              Season Leader
            </p>
            <p class="serif text-3xl">
              ${leader ? escapeHtml(leader.player) : "—"}
            </p>
          </div>

          <div class="bg-white border border-[#C5A367]/30 p-6 rounded shadow">
            <p class="text-xs uppercase tracking-[0.25em] text-[#C5A367] mb-2">
              Players Ranked
            </p>
            <p class="serif text-5xl">
              ${players.length}
            </p>
          </div>

          <div class="bg-white border border-[#C5A367]/30 p-6 rounded shadow">
            <p class="text-xs uppercase tracking-[0.25em] text-[#C5A367] mb-2">
              Certified Source
            </p>
            <p class="serif text-3xl">
              Museum JSON
            </p>
          </div>
        </section>

        <section class="bg-white border border-[#C5A367]/30 rounded shadow overflow-hidden">
          <div class="p-8 border-b border-[#C5A367]/20">
            <p class="text-xs uppercase tracking-[0.35em] text-[#C5A367] mb-3">
              ${sectionName} Leaderboard
            </p>

            <h2 class="serif text-5xl">
              ${escapeHtml(season.season || selectedSeason)} Standings
            </h2>

            <p class="text-sm text-gray-600 mt-3">
              Order of Merit points are awarded for Top 10 finishes in eligible competitions, with an additional 10 points awarded for each Division win.
            </p>
          </div>

          <div class="px-8 pt-6">
            <div class="bg-[#F9F7F2] border border-[#C5A367]/30 rounded p-5">
              <p class="text-xs uppercase tracking-[0.25em] text-[#C5A367] mb-3">
                Scoring Points
              </p>

              <div class="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-2 text-center">
                ${[
          ["1st", "10"],
          ["2nd", "8"],
          ["3rd", "6"],
          ["4th", "5"],
          ["5th", "4"],
          ["6th", "3"],
          ["7th", "2"],
          ["8th", "1"],
          ["9th", "1"],
          ["10th", "1"]
        ].map(([position, points]) => `
                  <div class="bg-white border border-[#C5A367]/20 rounded px-3 py-3">
                    <div class="font-bold">${position}</div>
                    <div class="text-sm text-gray-600">
                      ${points} ${points === "1" ? "pt" : "pts"}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          <div class="overflow-x-auto mt-6">
            <table class="w-full text-left">
              <thead class="bg-[#132419] text-white">
                <tr>
                  <th class="p-4 text-xs uppercase tracking-[0.2em]">Pos</th>
                  <th class="p-4 text-xs uppercase tracking-[0.2em]">Player</th>
                  <th class="p-4 text-xs uppercase tracking-[0.2em]">Points</th>
                  <th class="p-4 text-xs uppercase tracking-[0.2em]">Wins</th>
                  <th class="p-4 text-xs uppercase tracking-[0.2em]">Top 10</th>
                </tr>
              </thead>

              <tbody>
                ${players.length
          ? players.map(player => `
                      <tr class="border-b border-gray-200 hover:bg-[#F9F7F2] transition">
                        <td class="p-4 serif text-3xl">
                          ${medal(player.rank)}
                        </td>

                        <td class="p-4">
                          <button
                            type="button"
                            class="oom-player-button text-left font-semibold hover:text-[#C5A367] transition"
                            aria-expanded="false"
                            onclick="toggleBreakdown('${escapeHtml(player.slug)}', this)"
                          >
                            ${escapeHtml(player.player)}
                            <span class="ml-2 text-[#C5A367]">▼</span>
                          </button>

                          <a
                            href="player-profile.html?player=${encodeURIComponent(player.slug)}"
                            class="block text-xs text-gray-500 hover:text-[#C5A367] mt-1 transition"
                          >
                            View player profile
                          </a>
                        </td>

                        <td class="p-4 font-bold">
                          ${player.points}
                        </td>

                        <td class="p-4">
                          ${player.wins}
                        </td>

                        <td class="p-4">
                          ${player.top10}
                        </td>
                      </tr>

                      ${pointsBreakdown(player)}
                    `).join("")
          : `
                      <tr>
                        <td colspan="5" class="p-10 text-center text-gray-500">
                          No qualifying results are recorded for this season.
                        </td>
                      </tr>
                    `
        }
              </tbody>
            </table>
          </div>
        </section>

        <section class="bg-[#132419] text-white p-8 md:p-10 rounded shadow mt-12">
          <p class="text-xs uppercase tracking-[0.35em] text-[#C5A367] mb-4">
            Scoring System
          </p>

          <h2 class="serif text-4xl mb-4">
            ${sectionName} Order of Merit
          </h2>

          <p class="text-white/75 max-w-4xl">
            ${section === "seniors"
          ? "The Seniors leaderboard uses the approved Seniors scoring system. Qualifying medals, cups and trophies award one winner point, while Harrington competitions award two winner points."
          : "The Men's leaderboard uses the approved positional Order of Merit scoring system. Points are awarded for Top 10 finishes in eligible competitions, with an additional 10 points awarded for each Division win."
        }
          </p>
        </section>
      `;

      updateButtons();
    }

    async function loadOrderOfMerit() {
      try {
        const response = await fetch(
          "data/order-of-merit-certified.json",
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "Certified Order of Merit returned " +
            response.status
          );
        }

        const certifiedData =
          await response.json();

        if (
          certifiedData
            .certificationStatus !==
          "CERTIFIED"
        ) {
          throw new Error(
            "Order of Merit data is not certified."
          );
        }

        state.mens =
          certifiedData.mens;

        state.seniors =
          certifiedData.seniors;

        state.selectedSeason.mens =
          certifiedData.mens.currentSeason;

        state.selectedSeason.seniors =
          certifiedData.seniors.currentSeason;

        render("mens");

      } catch (error) {
        console.error(
          "Order of Merit failed to load",
          error
        );

        document
          .getElementById("oom")
          .innerHTML = `
            <div class="bg-white border border-red-200 p-8 rounded shadow">
              <h2 class="serif text-3xl mb-4">
                Order of Merit unavailable
              </h2>

              <p class="text-gray-600">
                The certified Museum Order of Merit could not be loaded.
              </p>
            </div>
          `;
      }
    }

    document
      .querySelectorAll(".oom-button")
      .forEach(button => {
        button.addEventListener("click", () => {
          render(button.dataset.section);
        });
      });

    loadOrderOfMerit();
  </script>
  <footer class="bg-[#07140d] text-white py-10 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="serif text-2xl">Dudley Golf Club Digital Museum</p>

      <div class="flex flex-col md:flex-row gap-6 text-center">
        <a href="digital-museum.html"
          class="text-[#C5A367] uppercase tracking-[0.25em] text-xs hover:text-white transition">
          Museum Home →
        </a>

        <a href="index.html" class="text-[#C5A367] uppercase tracking-[0.25em] text-xs hover:text-white transition">
          Club Website →
        </a>
      </div>
    </div>
  </footer>

</body>

</html>
