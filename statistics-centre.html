<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Statistics Centre | Dudley Golf Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Outfit, sans-serif;
      background: #F9F7F2;
      color: #132419;
    }

    .serif {
      font-family: "Cormorant Garamond", serif;
    }

    .section-tab[aria-selected="true"] {
      background: #132419;
      color: #fff;
      border-color: #132419;
    }
  </style>
</head>

<body>
  <header class="bg-[#132419] text-white px-6 py-5">
    <div class="max-w-7xl mx-auto">
      <a href="digital-museum.html"
        class="text-sm uppercase tracking-widest text-[#C5A367] font-bold hover:text-white transition">← Back to
        Museum</a>
    </div>
  </header>

  <section class="bg-[#132419] text-white px-6 py-20">
    <div class="max-w-7xl mx-auto">
      <p class="text-xs uppercase tracking-[0.4em] text-[#C5A367] mb-6">Digital Museum</p>
      <h1 class="serif text-6xl md:text-8xl leading-none mb-6">Statistics Centre</h1>
      <p class="max-w-3xl text-white/70 text-lg">Verified Men's, Seniors and Club records from the Dudley Golf Club
        Digital Museum.</p>
    </div>
  </section>

  <main id="top" class="max-w-7xl mx-auto px-6 py-16">
    <nav class="flex flex-wrap gap-3 mb-12" aria-label="Statistics section">
      <button type="button" class="section-tab border border-[#C5A367] rounded-full px-6 py-3 font-bold transition"
        data-section="Mens" aria-selected="true">Men's Records</button>
      <button type="button" class="section-tab border border-[#C5A367] rounded-full px-6 py-3 font-bold transition"
        data-section="Seniors" aria-selected="false">Seniors Records</button>
      <button type="button" class="section-tab border border-[#C5A367] rounded-full px-6 py-3 font-bold transition"
        data-section="Club" aria-selected="false">Club Records</button>
    </nav>

    <div id="stats">Loading statistics...</div>

    <div class="mt-14 text-center">
      <a href="#top"
        class="inline-flex items-center rounded-full bg-[#132419] px-6 py-3 text-sm font-bold uppercase tracking-widest text-white transition hover:bg-[#C5A367] hover:text-[#132419]">↑
        Back to Top</a>
    </div>
  </main>

  <script>
    const state = {
      activeSection: "Mens",
      records: null
    };

    function clean(value) {
      return String(value ?? "").trim();
    }

    function escapeHtml(value) {
      return clean(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function playerLink(item) {
      const player = clean(item?.player || item?.playerName);
      const slug = clean(item?.slug);

      if (!player) {
        return "Unknown";
      }

      if (!slug) {
        return escapeHtml(player);
      }

      return `
        <a
          href="player-profile.html?player=${encodeURIComponent(slug)}"
          class="hover:text-[#C5A367] transition"
        >
          ${escapeHtml(player)}
        </a>
      `;
    }

    function displayValue(item) {
      return escapeHtml(
        item?.displayValue ??
        item?.value ??
        ""
      );
    }

    function leaderboard(title, record) {
      const leaders = Array.isArray(record?.leaders)
        ? record.leaders
        : [];

      if (!leaders.length) {
        return `
          <section class="bg-white border border-[#C5A367]/30 p-8 rounded shadow">
            <h2 class="serif text-4xl mb-6">
              ${escapeHtml(title)}
            </h2>

            <p class="text-gray-500">
              No certified data available yet.
            </p>
          </section>
        `;
      }

      return `
        <section class="bg-white border border-[#C5A367]/30 p-8 rounded shadow">
          <h2 class="serif text-4xl mb-6">
            ${escapeHtml(title)}
          </h2>

          <div class="space-y-4">
            ${leaders.map((item, index) => `
              <div class="flex justify-between items-start gap-4 border-b border-gray-200 pb-3">
                <span>
                  <span class="text-[#C5A367] mr-3">
                    ${escapeHtml(item?.rank ?? index + 1)}
                  </span>

                  ${playerLink(item)}

                  ${item?.date ? `
                    <span class="block ml-8 mt-1 text-xs text-gray-500">
                      ${escapeHtml(item.date)}
                      ${item?.course ? ` · ${escapeHtml(item.course)}` : ""}
                    </span>
                  ` : ""}
                </span>

                <strong class="shrink-0">
                  ${displayValue(item)}
                </strong>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function sectionRecords(section) {
      const key = section === "Mens"
        ? "mens"
        : "seniors";

      return state.records?.[key] || {};
    }

    function renderPlayerSection(section) {
      const data = sectionRecords(section);
      const career =
        data.career || {};

      const championships =
        data.championships || {};
      const label = section === "Mens"
        ? "Men's"
        : "Seniors";

      return `
        <div class="mb-10">
          <p class="text-xs uppercase tracking-[0.35em] text-[#C5A367] mb-3">
            ${escapeHtml(section)}
          </p>

          <h2 class="serif text-5xl">
            ${label} Certified Records
          </h2>

          <p class="text-gray-600 mt-3 max-w-3xl">
            These rankings are displayed directly from the certified Museum output.
            The website does not recalculate wins, placings, appearances or scores.
          </p>
        </div>

        <section class="grid lg:grid-cols-2 gap-8">
          ${leaderboard(
            `${label} Most Wins`,
            career.mostWins
          )}

          ${leaderboard(
            `${label} Most Runner-up Finishes`,
            career.mostRunnerUp
          )}

          ${leaderboard(
            `${label} Most Top 3 Finishes`,
            career.mostTop3
          )}

          ${leaderboard(
            `${label} Most Top 5 Finishes`,
            career.mostTop5
          )}

          ${leaderboard(
            `${label} Most Top 10 Finishes`,
            career.mostTop10
          )}

          ${leaderboard(
            `${label} Most Competitions Played`,
            career.mostPlayed
          )}

          ${leaderboard(
            `${label} Most Major Wins`,
            championships.mostMajorWins
          )}

          ${leaderboard(
            `${label} Most Medal Wins`,
            championships.mostMedalWins
          )}
        </section>
      `;
    }

    function renderClub() {
      const museum = state.records?.museum || {};

      return `
        <div class="mb-10">
          <p class="text-xs uppercase tracking-[0.35em] text-[#C5A367] mb-3">
            Certified Museum Output
          </p>

          <h2 class="serif text-5xl">
            Club Scoring Records
          </h2>

          <p class="text-gray-600 mt-3 max-w-3xl">
            These records retain their source event, score type and verification basis.
          </p>
        </div>

        <section class="grid lg:grid-cols-2 gap-8">
          ${leaderboard(
            museum.lowest18HoleGross?.label ||
              "Lowest 18-Hole Gross Since 2021",
            museum.lowest18HoleGross
          )}

          ${leaderboard(
            museum.lowest18HoleNett?.label ||
              "Lowest 18-Hole Nett Since 2021",
            museum.lowest18HoleNett
          )}

          ${leaderboard(
            museum.lowest36HoleGross?.label ||
              "Lowest Completed 36-Hole Gross Since 2021",
            museum.lowest36HoleGross
          )}

          ${leaderboard(
            museum.lowest36HoleNett?.label ||
              "Lowest Completed 36-Hole Nett Since 2021",
            museum.lowest36HoleNett
          )}

          ${leaderboard(
            museum.highestStablefordScore?.label ||
              "Highest Stableford Score",
            museum.highestStablefordScore
          )}

          ${leaderboard(
            museum.mostRecordsHeld?.label ||
              "Most Hole In Ones",
            museum.mostRecordsHeld
          )}
        </section>
      `;
    }

    function render() {
      const container = document.getElementById("stats");

      container.innerHTML =
        state.activeSection === "Club"
          ? renderClub()
          : renderPlayerSection(state.activeSection);

      document
        .querySelectorAll(".section-tab")
        .forEach(button => {
          button.setAttribute(
            "aria-selected",
            button.dataset.section === state.activeSection
              ? "true"
              : "false"
          );
        });
    }

    async function loadStats() {
      const container = document.getElementById("stats");

      try {
        const response = await fetch(
          "data/statistics-centre-certified.json"
        );

        if (!response.ok) {
          throw new Error(
            `statistics-centre-certified.json returned ${response.status}`
          );
        }

        const certifiedData =
          await response.json();

        if (
          certifiedData
            .certificationStatus !==
          "CERTIFIED"
        ) {
          throw new Error(
            "Statistics Centre data is not certified."
          );
        }

        state.records = {
          mens:
            certifiedData.sections
              .mens,

          seniors:
            certifiedData.sections
              .seniors,

          museum:
            certifiedData.sections
              .club.records
        };

        render();
      } catch (error) {
        console.error(
          "Certified statistics failed to load",
          error
        );

        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 border border-[#C5A367]/30 shadow">
            <h2 class="serif text-3xl mb-4">
              Statistics unavailable
            </h2>

            <p class="text-gray-600">
              The certified Museum statistics could not be loaded.
            </p>
          </div>
        `;
      }
    }

    document
      .querySelectorAll(".section-tab")
      .forEach(button => {
        button.addEventListener("click", () => {
          state.activeSection =
            button.dataset.section;

          if (state.records) {
            render();
          }
        });
      });

    loadStats();
  </script>
</body>

</html>
